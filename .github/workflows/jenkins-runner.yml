name: Simulated Jenkins CI

on:
  push:
    branches:
      - '**'  # Runs on all branches

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'

    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    - name: Build
      run: ./gradlew assemble

    - name: Test
      run: ./gradlew test
